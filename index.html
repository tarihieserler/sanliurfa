<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#f5c778">
  <meta name="description" content="Şanlıurfa'nın Balıklıgöl'ünü, kalesini ve tarihî çarşılarını keşfet!">
  <title>Urfa'nın Minik Kaşifleri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game" aria-label="Şanlıurfa keşif oyunu"></main>
  <section id="start-screen" class="screen">
    <div class="intro-card">
      <span class="eyebrow">3D ŞEHİR KEŞFİ</span>
      <h1>Urfa'nın Minik<br><em>Kaşifleri</em></h1>
      <p>Balıklıgöl'den çarşıya uzanan sıcacık bir maceraya hazır mısın?</p>
      <div class="avatar-picker" aria-label="Kaşifini seç">
        <button class="avatar-option selected" data-outfit="coral" aria-label="Mercan kıyafet">🧢</button>
        <button class="avatar-option" data-outfit="teal" aria-label="Turkuaz kıyafet">🎒</button>
        <button class="avatar-option" data-outfit="lilac" aria-label="Lila kıyafet">🌼</button>
      </div>
      <button id="start-button" class="primary-button">Şehri keşfet <span>→</span></button>
      <small>Bilgisayar: WASD / yön tuşları · Etkileşim: E</small>
    </div>
    <div class="start-sticker fish-sticker">🐟</div><div class="start-sticker sun-sticker">☀️</div>
  </section>
  <header id="hud" class="hidden">
    <button id="home-button" class="icon-button" aria-label="Ana menü">⌂</button>
    <div class="mission-card"><span class="mission-icon">🧭</span><div><small>ŞİMDİKİ GÖREV</small><strong id="mission-text">Balıklıgöl'ü bul</strong></div></div>
    <div class="collection-pill"><span>✨</span><b id="star-count">0</b><small>/ 5</small></div>
  </header>
  <div id="prompt" class="prompt hidden">Yaklaş ve <kbd>E</kbd>'ye bas</div>
  <div id="toast" role="status"></div>
  <div id="joystick" class="hidden" aria-label="Hareket kontrolü"><span></span></div>
  <button id="interact-button" class="touch-action hidden" aria-label="Etkileşim">✋</button>
  <section id="dialog" class="dialog hidden" role="dialog" aria-modal="true"></section>
  <aside id="discovery" class="discovery hidden"><span>📍</span><div><b id="discovery-title"></b><small id="discovery-copy"></small></div></aside>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
